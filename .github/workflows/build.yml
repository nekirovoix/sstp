name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/SstpDeployManager/SstpDeployManager.csproj
      - name: Publish
        run: >-
          dotnet publish src/SstpDeployManager/SstpDeployManager.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/windows-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: SstpDeployManager-Windows-x64
          path: artifacts/windows-x64/SstpDeployManager.exe
